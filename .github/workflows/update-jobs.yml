name: Update Ask RAE jobs

on:
  # Daily schedule is off while testing on the free plan. Turn on after upgrading:
  # schedule:
  #   - cron: "17 11 * * *"   # every day around 6:17 a.m. Central
  workflow_dispatch:          # lets you run it by hand from the Actions tab
    inputs:
      mode:
        description: "test = one small check (25 jobs). full = the normal daily pull."
        type: choice
        options: [test, full]
        default: test

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull admin jobs from company career sites
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          MODE: ${{ inputs.mode || 'full' }}
        run: node scripts/fetch-jobs.mjs
      - name: Save today's list
        run: |
          git config user.name "ask-rae-bot"
          git config user.email "ask-rae-bot@users.noreply.github.com"
          git add public/jobs.json
          git diff --cached --quiet || git commit -m "Update jobs $(date -u +%F)"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
