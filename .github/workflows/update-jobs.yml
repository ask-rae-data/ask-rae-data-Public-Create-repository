name: Update Ask RAE jobs

# Free version: reads each company's own career site (see companies.json).
# Runs every morning, by hand from the Actions tab, and whenever the company list changes.
on:
  schedule:
    - cron: "17 11 * * *"   # every day around 6:17 a.m. Central
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["companies.json", "scripts/fetch-free.mjs"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-jobs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull admin jobs from company career sites
        run: node scripts/fetch-free.mjs
      - name: Save today's list
        run: |
          git config user.name "ask-rae-bot"
          git config user.email "ask-rae-bot@users.noreply.github.com"
          git add public/jobs.json public/report.json
          git diff --cached --quiet || git commit -m "Update jobs $(date -u +%F)"
          git pull --rebase origin main
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
